# Brain Tumor Detection Configuration

# Model Configuration
model:
  name: "EfficientNetB4_BrainTumor"
  architecture: "efficientnet-b4" # Options: efficientnet-b4, resnet50, vgg16, inception_v3
  input_shape: [224, 224, 3]
  num_classes: 4 # glioma, meningioma, pituitary, no_tumor
  pretrained: true
  dropout_rate: 0.3

# Training Configuration
training:
  batch_size: 32
  epochs: 50
  learning_rate: 0.0001
  optimizer: "adam"
  loss: "categorical_crossentropy"
  early_stopping_patience: 10
  reduce_lr_patience: 5
  validation_split: 0.2
  test_split: 0.1

# Data Augmentation
augmentation:
  rotation_range: 20
  width_shift_range: 0.2
  height_shift_range: 0.2
  horizontal_flip: true
  vertical_flip: false
  zoom_range: 0.15
  brightness_range: [0.8, 1.2]
  fill_mode: "nearest"

# Data Paths
data:
  raw_data_path: "../data/raw"
  processed_data_path: "../data/processed"
  train_path: "../data/processed/train"
  val_path: "../data/processed/val"
  test_path: "../data/processed/test"

# Model Paths
paths:
  model_save_path: "./models"
  logs_path: "./logs"
  checkpoints_path: "./checkpoints"
  results_path: "./results"

# API Configuration
api:
  host: "0.0.0.0"
  port: 5000
  debug: false
  upload_folder: "./uploads"
  max_file_size: 16777216 # 16MB
  allowed_extensions: ["png", "jpg", "jpeg", "bmp", "tiff"]

# Class Labels (must match data folder names exactly)
classes:
  - "glioma"
  - "meningioma"
  - "notumor"
  - "pituitary"

# Confidence Threshold
prediction:
  confidence_threshold: 0.6
  top_k: 3
